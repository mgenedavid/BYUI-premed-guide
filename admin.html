<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><title>Admin Prototype</title></head><body><div data-nav></div><div class="page-head"><span class="eyebrow">Prototype moderation</span><h1>Review Moderation</h1><p>This static build demonstrates the moderation workflow. Production admin access must move to authenticated server-side authorization.</p></div><main class="container" style="padding-top:18px"><div id="adminReviews"></div></main><div data-foot></div><script src="app.js"></script><script>function draw(){let a=getReviews();adminReviews.innerHTML=a.length?a.map(r=>`<article class="review"><b>${r.course}</b> · <span class="tag">${r.status}</span><p>${esc(r.advice)}</p><button class="btn primary" onclick="setStatus(${r.id},'approved')">Approve</button> <button class="btn soft" onclick="setStatus(${r.id},'rejected')">Reject</button> <button class="btn soft" onclick="removeReview(${r.id})">Delete</button></article>`).join(''):'<div class="panel">No submitted reviews yet.</div>'}function setStatus(id,s){let a=getReviews(),r=a.find(x=>x.id===id);if(r)r.status=s;setReviews(a);draw()}function removeReview(id){setReviews(getReviews().filter(x=>x.id!==id));draw()}draw();</script></body></html>
