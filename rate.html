<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><title>Rate a Course</title></head><body><div data-nav></div><main class="page-shell course-detail-wrap"><a id="back" class="backlink" href="courses.html">← Back to Course</a><div><span id="code" class="course-code"></span><h1 id="title" style="font-family:'Libre Baskerville',serif"></h1></div><section class="review-form-card"><div class="form-head"><h2>☆ Rate This Course</h2><p>Your review helps fellow pre-med students make informed decisions. Submissions are reviewed by the site admin before appearing publicly.</p></div><form id="form" class="review-form"><div class="ratings-four" id="ratingFields"></div><label><span>Estimated Weekly Workload (hours) *</span><input name="workload" type="number" min="0" max="80" required placeholder="e.g. 8"></label><label style="display:flex;gap:10px;align-items:center"><input name="lab" type="checkbox" style="width:auto"> This course has a lab component</label><div class="field-row"><label><span>Professor (optional)</span><input name="professor" placeholder="e.g. Dr. Smith"></label><label><span>Semester Taken *</span><select name="semester" required><option value="">Select</option><option>Fall</option><option>Winter</option><option>Spring</option></select></label><label><span>Grade Received</span><select name="grade"><option value="">Select</option><option>A</option><option>A-</option><option>B+</option><option>B</option><option>B-</option><option>C+</option><option>C</option><option>Other</option></select></label></div><label><span>Student Advice *</span><textarea name="advice" required placeholder="What should future students know about this course?"></textarea></label><label style="display:flex;gap:10px;align-items:center"><input name="recommend" type="checkbox" style="width:auto" checked> I would recommend this course</label><button class="btn-primary" type="submit">Submit Review for Moderation</button><p id="msg"></p></form></section></main><div data-foot></div><script src="app.js"></script><script src="rate.js"></script></body></html>
