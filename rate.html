<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><title>Rate Course</title></head><body><div data-nav></div><main class="container narrow"><a id="back" class="muted">← Back to course</a><div class="page-head" style="padding-left:0"><span class="eyebrow">Share your experience</span><h1><span id="code"></span> · <span id="title"></span></h1><p>Your review enters moderation before appearing publicly. Focus on the course experience, not personal attacks.</p></div><form id="form" class="form-card"><div id="ratingFields" class="form-grid"></div><div class="form-grid" style="margin-top:20px"><div class="field"><label>Average hours per week outside class *</label><input required type="number" name="workload" min="0" max="40" placeholder="e.g. 6"></div><div class="field"><label>Would you recommend this course?</label><select name="recommend"><option value="yes">Yes</option><option value="">No</option></select></div></div><div class="field" style="margin-top:20px"><label>What should another student know? *</label><textarea required name="advice" placeholder="Study strategies, workload patterns, what surprised you, or what helped you succeed..."></textarea></div><button class="btn primary" style="margin-top:20px">Submit for Moderation</button><p id="msg"></p></form></main><div data-foot></div><script src="app.js"></script><script src="rate.js"></script></body></html>
